# sofleii ("Sofle Interactive Interface"), the site for this repo: the
# Eyelash Sofle firmware docs and the planned sofleii CLI/TUI.
# https://sofleii.dlu.one/, served by GitHub Pages with a custom domain
# (static/CNAME). Links go through relURL, so the site also works under a
# subpath like rdlu.github.io/sofleii/ if the domain goes.
baseURL = "https://sofleii.dlu.one/"
title = "sofleii"
locale = "en"
# Hextra v0.13.0, vendored (trimmed) into themes/hextra: no Go modules, no Node.
theme = "hextra"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[outputs]
  home = ["html"]
  section = ["html"]
  page = ["html"]

[markup.goldmark.renderer]
  unsafe = true # <kbd>, <video> and small layout wrappers in Markdown
[markup.highlight]
  noClasses = false
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[[menu.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 1
[[menu.main]]
  name = "Search"
  weight = 2
  [menu.main.params]
    type = "search"
[[menu.main]]
  name = "Theme"
  weight = 3
  [menu.main.params]
    type = "theme-toggle"
[[menu.main]]
  name = "GitHub"
  url = "https://github.com/rdlu/sofleii"
  weight = 4
  [menu.main.params]
    icon = "github"

[params]
  description = "Sofle Interactive Interface: ZMK firmware for the Eyelash Sofle split keyboard (home-row mods, nine layers, gaming mode, per-layer underglow, Studio over USB and Bluetooth) and a planned CLI/TUI to manage it."
  displayUpdatedDate = false

  [params.navbar]
    displayTitle = true
    displayLogo = true
    width = "wide"
    [params.navbar.logo]
      path = "favicon.svg"
      dark = "favicon.svg"
      width = 26
      height = 26

  [params.theme]
    default = "dark"
    displayToggle = true

  # The footer's `whoami` block (layouts/_partials/custom/footer.html).
  [params.author]
    name = "Rodrigo Dlugokenski"
    location = "Rio de Janeiro / Porto Alegre, Brazil"
    since = 2026
    [[params.author.links]]
      label = "r.dlu.one"
      url = "https://r.dlu.one"
    [[params.author.links]]
      label = "github.com/rdlu"
      url = "https://github.com/rdlu"
    [[params.author.links]]
      label = "bsky @r.dlu.one"
      url = "https://bsky.app/profile/r.dlu.one"
    [[params.author.links]]
      label = "programming.dev/u/rdlu"
      url = "https://programming.dev/u/rdlu"

  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = true

  [params.page]
    width = "wide" # room for the keymap render

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"
      # Vendored (assets/lib/flexsearch, Apache-2.0), so the build needs no
      # network: without this Hextra fetches it from jsDelivr.
      js = "lib/flexsearch/flexsearch.bundle.min.js"

  [params.highlight.copy]
    enable = true
    display = "hover"

  [params.editURL]
    enable = false

# Source-of-truth files from the repo, mounted into assets/ so templates read
# them on every build: no copies, no generator. Declaring an assets mount
# replaces the default one, so assets/ itself is mounted first.
[[module.mounts]]
  source = "assets"
  target = "assets"
# The keymap render, regenerated by .github/workflows/draw.yml on every
# config/ change (the `keymap-svg` shortcode).
[[module.mounts]]
  source = "../keymap-drawer"
  target = "assets/keymap"
  files = ["eyelash_sofle.svg"]
# The keymap itself (hold-tap behaviors and combos, read by the
# `keymap-behaviors` and `keymap-combos` shortcodes) and the west manifest
# (dependency pins, the `west-pins` shortcode).
[[module.mounts]]
  source = "../config"
  target = "assets/config"
  files = ["eyelash_sofle.keymap", "west.yml"]
