name: Build ZMK firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "build.yaml"
      - "zmk-rgb-layer/**"
      - "zmk-sofleii-id/**"
      - ".github/workflows/build.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85  # track: main (ZMK-main / Zephyr 4.1 build container)
