name: Pages

# The sofleii site (site/), served at https://sofleii.dlu.one/.
on:
  # Docs-only inputs. The hugo pin lives in site/.hugo-version, so it is
  # covered by site/**.
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/install-hugo.sh'
  # The pages built from the firmware's files (keymap render, hold-tap and
  # combo tables, west pins) refresh through Draw Keymap instead, which runs
  # on every config/** push. Its [Draw] commit of the SVG is made with
  # GITHUB_TOKEN, and such pushes never trigger push workflows, so a push
  # filter couldn't see it anyway. The `changes` job below drops the runs
  # where no docs input changed.
  workflow_run:
    workflows: ['Draw Keymap']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued one waits rather than cancelling a
# deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # workflow_run only: deploy when the Draw run succeeded AND a docs input
  # changed between the commit that triggered it and main now. Diffing from
  # the trigger's first parent catches both the trigger itself (a keymap or
  # west.yml change, even when Draw commits nothing) and the [Draw] commit it
  # pushed after it. A .conf-only push changes none of them: no redeploy.
  changes:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      # Full history, but trees only (no blobs): enough for git diff --name-only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: diff
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          changed=$(git diff --name-only "$TRIGGER_SHA^" HEAD -- \
            config/eyelash_sofle.keymap config/west.yml keymap-drawer/eyelash_sofle.svg)
          echo "docs inputs changed since ${TRIGGER_SHA:0:8}^: ${changed:-none}"
          echo "deploy=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    # `changes` is skipped on push and workflow_dispatch: build anyway there.
    if: >-
      !cancelled() && !failure() &&
      (github.event_name != 'workflow_run' || needs.changes.outputs.deploy == 'true')
    runs-on: ubuntu-24.04
    steps:
      # On workflow_run, GITHUB_SHA is the latest commit on main, so this
      # includes the [Draw] commit the run just pushed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The only download: the site itself builds offline (theme and
      # FlexSearch are vendored).
      - run: .github/scripts/install-hugo.sh "$RUNNER_TEMP/hugo"
      - run: hugo --minify
        working-directory: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
