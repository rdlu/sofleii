[tools]
"pipx:weasyprint" = "latest"

# Python comes from pacman, not mise: the global mise config disables the
# python tool, so a pinned interpreter + .venv here was never activated and
# west/cmake always ran on /usr/bin/python. `mise run setup` checks the
# packages the build actually imports.
[env]
# Pin the toolchain explicitly (Zephyr 3.5 errored out in FindZephyr-sdk.cmake when unset; harmless on 4.1)
ZEPHYR_TOOLCHAIN_VARIANT = "zephyr"
ZEPHYR_SDK_INSTALL_DIR = "{{config_root}}/tools/zephyr-sdk-0.17.0"

[tasks.setup]
description = "Check system Python deps, then initialize the west workspace (run once after cloning)"
run = """
set -eu
# The modules a build imports, with the Arch package that ships each. Zephyr's
# requirements.txt lists more (flash runners, canopen, ...); none are needed to
# build. google.protobuf + pkg_resources are for the left half's Studio nanopb
# codegen, which Zephyr's requirements don't cover.
missing=$(python3 - <<'PYEOF'
import importlib, warnings
warnings.simplefilter("ignore")
pkgs = {
    "west": "python-west",
    "yaml": "python-yaml",
    "elftools": "python-pyelftools",
    "pykwalify": "python-pykwalify",
    "packaging": "python-packaging",
    "google.protobuf": "python-protobuf",
    "pkg_resources": "python-pkg_resources",
}
for mod, pkg in pkgs.items():
    try:
        importlib.import_module(mod)
    except ImportError:
        print(pkg, end=" ")
PYEOF
)
if [ -n "$missing" ]; then
  echo "Missing Python packages: $missing"
  echo "Install: pkexec pacman -S --needed $missing"
  exit 1
fi
[ -d .west ] || west init -l config/
west update
west zephyr-export
# The SDK's host tools (dtc, ...) embed their absolute install path in the ELF
# interpreter; this relocates them and registers the SDK with CMake. Re-run it
# whenever the checkout moves.
if [ -x "$ZEPHYR_SDK_INSTALL_DIR/setup.sh" ]; then
  (cd "$ZEPHYR_SDK_INSTALL_DIR" && ./setup.sh -h -c)
else
  echo "NOTE: no Zephyr SDK at $ZEPHYR_SDK_INSTALL_DIR (0.17.0 expected) — install it there, then re-run setup."
fi
"""

[tasks.doctor]
description = "Check the local west workspace against config/west.yml — catches the drift that causes 'Invalid BOARD: nice_nano//zmk'"
# Why this exists: on 2026-09-02 `mise run build-left` died at CMake configure
# with "Invalid BOARD: nice_nano_v2" while CI built the same commit fine. The
# manifest was correct; the local zmk/ clone's git remote still pointed at
# zmkfirmware/zmk (a leftover from before the cormoran fork switch — west names
# remotes from the manifest but will NOT repoint an existing clone), so
# `west update` silently could not fetch v0.3-branch+dya and left zmk/ parked on
# an unrelated commit from a newer HWMv2 / Zephyr 4.1 line where nice_nano_v2
# does not exist. Every project west manages carries a `manifest-rev` ref
# pointing at the revision the manifest resolved to, so HEAD != manifest-rev is
# the general, project-agnostic signal for this whole class of drift.
run = """
set -eu

WORK=$(mktemp -d)
trap 'rm -rf "$WORK"' EXIT
DRIFT="$WORK/drift"
: > "$DRIFT"

if [ ! -d zmk ] || [ ! -d zephyr ]; then
  echo "ERROR: west workspace not initialized (zmk/ or zephyr/ missing)."
  echo "       Run: mise run setup"
  exit 1
fi

echo ">> Projects vs config/west.yml"
west list -f '{name}|{url}|{abspath}' | while IFS='|' read -r name url path; do
  # The manifest project (this repo's config/) has no upstream URL.
  case "$url" in ''|'N/A') continue ;; esac

  if [ ! -e "$path/.git" ]; then
    echo "   MISSING  $name — not cloned at $path"
    echo "$name" >> "$DRIFT"
    continue
  fi

  # west writes manifest-rev in every project = the revision the manifest
  # resolved to at the last successful update. HEAD must equal it.
  if ! want=$(git -C "$path" rev-parse manifest-rev 2>/dev/null); then
    echo "   NO-REF   $name — no manifest-rev, project was never updated"
    echo "$name" >> "$DRIFT"
  else
    head=$(git -C "$path" rev-parse HEAD)
    if [ "$head" != "$want" ]; then
      echo "   DRIFT    $name"
      echo "            HEAD         $(git -C "$path" log --oneline -1 HEAD)"
      echo "            manifest-rev $(git -C "$path" log --oneline -1 manifest-rev)"
      echo "$name" >> "$DRIFT"
    fi
  fi

  # A wrong remote URL is the failure that silently breaks `west update`.
  if ! git -C "$path" remote -v | grep -qF "$url"; then
    echo "   REMOTE   $name — manifest wants $url, clone has:"
    git -C "$path" remote -v | awk '{print "            " $1 "  " $2}' | sort -u
    echo "$name" >> "$DRIFT"
  fi
done

echo ">> Build prerequisites"
if [ ! -f zmk/app/boards/nicekeyboards/nice_nano/nice_nano_nrf52840_zmk.dts ]; then
  echo "   FAIL  zmk/app/boards/nicekeyboards/nice_nano/nice_nano_nrf52840_zmk.dts missing"
  echo "         Builds will abort with 'Invalid BOARD: nice_nano//zmk'."
  echo "         (A v0.3 / Zephyr 3.5 tree has nice_nano_v2 at boards/arm/nice_nano/ instead.)"
  echo "board" >> "$DRIFT"
else
  echo "   ok    board nice_nano//zmk"
fi

if [ -f zephyr/VERSION ]; then
  ZMAJ=$(sed -n 's/^VERSION_MAJOR *= *//p' zephyr/VERSION | tr -d ' ')
  ZMIN=$(sed -n 's/^VERSION_MINOR *= *//p' zephyr/VERSION | tr -d ' ')
  if [ "$ZMAJ.$ZMIN" != "4.1" ]; then
    echo "   FAIL  Zephyr $ZMAJ.$ZMIN — the ZMK-main base needs 4.1"
    echo "zephyr" >> "$DRIFT"
  else
    echo "   ok    Zephyr $ZMAJ.$ZMIN"
  fi
else
  echo "   FAIL  zephyr/VERSION missing"
  echo "zephyr" >> "$DRIFT"
fi

if [ -d "$ZEPHYR_SDK_INSTALL_DIR" ]; then
  echo "   ok    Zephyr SDK at $ZEPHYR_SDK_INSTALL_DIR"
else
  echo "   FAIL  Zephyr SDK not found at $ZEPHYR_SDK_INSTALL_DIR"
  echo "         Do NOT substitute the AUR zephyr-sdk — it targets Zephyr 4.2+ (we are on 4.1)."
  echo "sdk" >> "$DRIFT"
fi

echo ""
if [ -s "$DRIFT" ]; then
  echo "❌ Workspace has drifted from config/west.yml."
  echo "   Repair with:  mise run doctor-fix"
  exit 1
fi
echo "✅ Workspace matches config/west.yml — local builds should match CI."
"""

[tasks.doctor-fix]
description = "Repair a drifted west workspace: repoint remotes at the manifest URLs, west update, drop the stale build/"
run = """
set -eu

repoint() {
  west list -f '{name}|{url}|{abspath}' | while IFS='|' read -r name url path; do
    case "$url" in ''|'N/A') continue ;; esac
    [ -e "$path/.git" ] || continue
    git -C "$path" remote -v | grep -qF "$url" && continue
    RNAME=$(git -C "$path" remote | head -1)
    [ -n "$RNAME" ] || continue
    echo "   $name: remote '$RNAME' -> $url"
    git -C "$path" remote set-url "$RNAME" "$url"
  done
}

echo ">> Repointing project remotes at the manifest URLs..."
repoint

echo ">> west update..."
west update

# Again after the update: a new zmk revision can import a manifest that moves
# other projects to new URLs (hal_stm32, lvgl, nanopb on the v0.3 -> v4 move,
# 2026-10-17), and west fetches those without repointing the existing clones.
echo ">> Repointing remotes the updated manifest changed..."
repoint

# build/ caches the resolved board and Zephyr paths from the OLD tree; leaving it
# makes the next build fail or, worse, succeed against stale generated headers.
echo ">> Removing stale build/..."
rm -rf build

echo ""
mise run doctor
"""

[tasks.deps-check]
description = "Check whether any SHA/tag-pinned west dependency has newer upstream commits or tags available"
# The counterpart to `doctor`. They look in opposite directions:
#   doctor      — does the WORKSPACE match the manifest?      (drift from the pin)
#   deps-check  — has UPSTREAM moved past the manifest?       (updates to the pin)
# Pinning trades silent auto-updates for explicit ones, so this is what replaces
# the thing you lose. Each pinned project carries a `# track: <ref>` comment in
# config/west.yml naming the upstream ref its SHA was taken from; `tags` means
# compare against the newest remote tag instead of a branch tip.
# Network cost is one `git ls-remote` per project — no fetching, no clones.
run = '''
set -eu

python3 - <<'PYEOF_DEPS'
import re
import subprocess
import sys

MANIFEST = "config/west.yml"

# --- what the manifest pins, and what upstream ref each pin came from --------
text = open(MANIFEST).read()
pins = []
current = None
for line in text.splitlines():
    m = re.match(r"\s*-\s+name:\s+(\S+)", line)
    if m:
        current = m.group(1)
        continue
    m = re.match(r"\s*revision:\s+(\S+)\s*#\s*track:\s*(\S+)", line)
    if m and current:
        pins.append((current, m.group(1), m.group(2)))

if not pins:
    print("No '# track:' annotations found in " + MANIFEST + " — nothing to check.")
    sys.exit(0)

# --- project URLs come from west itself, not from re-parsing the YAML -------
urls = {}
out = subprocess.run(["west", "list", "-f", "{name}|{url}"],
                     capture_output=True, text=True).stdout
for line in out.splitlines():
    parts = line.split("|")
    if len(parts) == 2 and parts[1] not in ("", "N/A"):
        urls[parts[0]] = parts[1]


def ls_remote(url, pattern=None):
    cmd = ["git", "ls-remote"]
    if pattern == "tags":
        cmd += ["--tags", "--refs"]
    cmd.append(url)
    if pattern and pattern != "tags":
        cmd.append(pattern)
    r = subprocess.run(cmd, capture_output=True, text=True)
    if r.returncode != 0:
        return None
    rows = []
    for line in r.stdout.splitlines():
        bits = line.split()
        if len(bits) == 2:
            rows.append((bits[0], bits[1]))
    return rows


def version_key(tag):
    return [int(n) for n in re.findall(r"\d+", tag)] or [0]


behind = []
errors = []
print(">> Pinned dependencies vs upstream")
print("")

for name, pinned, track in pins:
    url = urls.get(name)
    if not url:
        errors.append(name + ": no URL (project not in `west list`)")
        continue

    if track == "tags":
        rows = ls_remote(url, "tags")
        if rows is None:
            errors.append(name + ": ls-remote failed")
            continue
        tags = sorted({r.split("refs/tags/")[-1] for _, r in rows}, key=version_key)
        newest = tags[-1] if tags else None
        if newest and newest != pinned:
            status = "UPDATE -> " + newest
            behind.append((name, pinned, newest, "tag"))
        else:
            status = "up to date"
        print("   %-36s %-22s %-12s %s" % (name, "tags", pinned, status))
    else:
        rows = ls_remote(url, "refs/heads/" + track)
        if rows is None or not rows:
            errors.append(name + ": could not resolve " + track)
            continue
        tip = rows[0][0]
        if not tip.startswith(pinned) and not pinned.startswith(tip[:len(pinned)]):
            status = "UPDATE -> " + tip[:12]
            behind.append((name, pinned, tip, "commit"))
        else:
            status = "up to date"
        print("   %-36s %-22s %-12s %s" % (name, track, pinned[:12], status))

print("")
if errors:
    print("Problems:")
    for e in errors:
        print("   " + e)
    print("")

if not behind:
    print("All pinned dependencies are at their tracked upstream tip.")
    sys.exit(0)

print(str(len(behind)) + " update(s) available:")
for name, pinned, new, kind in behind:
    print("   " + name)
    print("      pinned:   " + pinned)
    print("      upstream: " + new)
print("")
print("To take one:")
print("   1. edit config/west.yml — set that project's revision to the new value")
print("      (keep its '# track:' comment so this task keeps working)")
print("   2. west update && mise run doctor")
print("   3. mise run build-left && mise run build-right    # it must still compile")
print("   4. commit config/west.yml with the reason for the bump")
print("")
print("NOTE: bumping zmk can change zmk/app/west.yml's own zephyr entry.")
print("      config/west.yml overrides zephyr, so mirror any such change there.")
PYEOF_DEPS
'''

[tasks.doctor-ci]
description = "Compare the local west checkouts against the SHAs the last successful main CI build resolved (needs gh)"
# CI is the source of truth for what the manifest resolves to: it runs a fresh
# `west init && west update` every time. A green CI build alongside a broken
# local build means the workspace drifted, not the manifest.
run = """
set -eu

command -v gh >/dev/null || { echo "ERROR: gh not found."; exit 1; }

WORK=$(mktemp -d)
trap 'rm -rf "$WORK"' EXIT

echo ">> Finding the last successful 'Build ZMK firmware' run on main..."
RUN_ID=$(gh run list --repo rdlu/sofleii --workflow "Build ZMK firmware" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
[ -n "$RUN_ID" ] || { echo "ERROR: no successful main build found."; exit 1; }
echo "   run $RUN_ID"

gh run view "$RUN_ID" --repo rdlu/sofleii --log > "$WORK/log" 2>/dev/null

# The west update output interleaves "=== updating <name> (<path>):" with the
# following "HEAD is now at <sha> <subject>" line. Pair them up.
# The run log interleaves ALL parallel build jobs, so narrow to one job first
# (otherwise another job's "HEAD is now at" line gets paired with this job's
# "=== updating", which silently mis-attributes SHAs). West also prints the
# HEAD line twice for some projects, so record into a map keyed by project
# rather than printing on the first match.
# Field-walked rather than regex-matched: a TOML basic string treats a
# backslash as an escape, so the awk program must stay backslash-free.
awk -F'\t' '$1 ~ /eyelash_sofle_left/ {print $3}' "$WORK/log" | awk '
  {
    for (i = 1; i <= NF; i++) {
      if ($i == "===" && $(i+1) == "updating") { cur = $(i+2); break }
      if (cur != "" && $i == "HEAD" && $(i+1) == "is" && $(i+2) == "now" && $(i+3) == "at") {
        map[cur] = $(i+4); break
      }
    }
  }
  END { for (k in map) print k "|" map[k] }
' | sort -u > "$WORK/ci"

[ -s "$WORK/ci" ] || { echo "ERROR: could not parse project SHAs from the run log."; exit 1; }

DIFF=0
echo ">> Local vs CI"
while IFS='|' read -r name sha; do
  path=$(west list -f '{name}|{abspath}' | awk -F'|' -v n="$name" '$1 == n {print $2}')
  [ -n "$path" ] && [ -e "$path/.git" ] || continue
  local_full=$(git -C "$path" rev-parse HEAD)
  case "$local_full" in
    "$sha"*) ;;
    *)
      echo "   DIFF  $name  local $(git -C "$path" rev-parse --short HEAD)  CI $sha"
      DIFF=1
      ;;
  esac
done < "$WORK/ci"

echo ""
if [ "$DIFF" -eq 1 ]; then
  echo "❌ Local checkouts differ from CI. Repair with:  mise run doctor-fix"
  exit 1
fi
echo "✅ Local checkouts match the last successful CI build."
"""

[tasks.build-left]
description = "Build left half firmware (ZMK Studio enabled)"
run = """
west build -s zmk/app -b nice_nano//zmk --pristine -- \
  -DZMK_CONFIG="$(pwd)/config" \
  -DZMK_EXTRA_MODULES="$(pwd)/zmk-rgb-layer" \
  -DSHIELD="eyelash_sofle_left nice_view" \
  -DCONFIG_ZMK_STUDIO=y \
  -DCONFIG_ZMK_STUDIO_LOCKING=n \
  -DSNIPPET="studio-rpc-usb-uart"
cp build/zephyr/zmk.uf2 eyelash_sofle_left.uf2
"""

[tasks.build-right]
description = "Build right half firmware"
run = """
west build -s zmk/app -b nice_nano//zmk --pristine -- \
  -DZMK_CONFIG="$(pwd)/config" \
  -DZMK_EXTRA_MODULES="$(pwd)/zmk-rgb-layer" \
  -DSHIELD="eyelash_sofle_right nice_view"
cp build/zephyr/zmk.uf2 eyelash_sofle_right.uf2
"""

[tasks.build-reset]
description = "Build settings reset firmware (clears Bluetooth bonds)"
run = """
west build -s zmk/app -b nice_nano//zmk --pristine -- \
  -DZMK_CONFIG="$(pwd)/config" \
  -DSHIELD=settings_reset
cp build/zephyr/zmk.uf2 settings_reset.uf2
"""

[tasks.flash-left]
description = "Flash locally-built left half — waits up to 60s for NICENANO mount"
run = """
set -euo pipefail
MOUNT="/run/media/$USER/NICENANO"
UF2="eyelash_sofle_left.uf2"
[ -f "$UF2" ] || { echo "ERROR: $UF2 not found — run 'mise run build-left' first"; exit 1; }
echo ">> Double-tap RESET on the LEFT half now"
for _ in $(seq 1 60); do [ -d "$MOUNT" ] && break; sleep 1; done
[ -d "$MOUNT" ] || { echo "ERROR: NICENANO not detected within 60s"; exit 1; }
sleep 1
cp "$UF2" "$MOUNT/"
sync
echo "✅ Left half flashed."
"""

[tasks.flash-right]
description = "Flash locally-built right half — waits up to 60s for NICENANO mount"
run = """
set -euo pipefail
MOUNT="/run/media/$USER/NICENANO"
UF2="eyelash_sofle_right.uf2"
[ -f "$UF2" ] || { echo "ERROR: $UF2 not found — run 'mise run build-right' first"; exit 1; }
echo ">> Double-tap RESET on the RIGHT half now"
for _ in $(seq 1 60); do [ -d "$MOUNT" ] && break; sleep 1; done
[ -d "$MOUNT" ] || { echo "ERROR: NICENANO not detected within 60s"; exit 1; }
sleep 1
cp "$UF2" "$MOUNT/"
sync
echo "✅ Right half flashed."
"""

[tasks.flash-reset]
description = "Flash locally-built settings_reset — waits up to 60s for NICENANO mount"
run = """
set -euo pipefail
MOUNT="/run/media/$USER/NICENANO"
UF2="settings_reset.uf2"
[ -f "$UF2" ] || { echo "ERROR: $UF2 not found — run 'mise run build-reset' first"; exit 1; }
echo ">> Double-tap RESET on the half to clear now"
for _ in $(seq 1 60); do [ -d "$MOUNT" ] && break; sleep 1; done
[ -d "$MOUNT" ] || { echo "ERROR: NICENANO not detected within 60s"; exit 1; }
sleep 1
cp "$UF2" "$MOUNT/"
sync
echo "✅ settings_reset flashed. Now flash the normal firmware on top."
"""

[tasks.build-flash]
description = "Build both halves locally, flash interactively, print memory budget at end"
run = """
set -euo pipefail

MOUNT="/run/media/$USER/NICENANO"
LEFT_UF2="eyelash_sofle_left.uf2"
RIGHT_UF2="eyelash_sofle_right.uf2"
LEFT_LOG=$(mktemp)
RIGHT_LOG=$(mktemp)
trap 'rm -f "$LEFT_LOG" "$RIGHT_LOG"' EXIT

echo ">> Building LEFT half..."
mise run build-left 2>&1 | tee "$LEFT_LOG"

echo ""
echo ">> Building RIGHT half..."
mise run build-right 2>&1 | tee "$RIGHT_LOG"

[ -f "$LEFT_UF2" ]  || { echo "ERROR: $LEFT_UF2 missing after build";  exit 1; }
[ -f "$RIGHT_UF2" ] || { echo "ERROR: $RIGHT_UF2 missing after build"; exit 1; }

wait_for_mount() {
  local label="$1"
  echo ""
  echo "==============================================="
  echo ">> Double-tap RESET on the $label half now"
  echo "==============================================="
  for _ in $(seq 1 60); do
    if [ -d "$MOUNT" ]; then
      sleep 1  # give udisks a moment to finish mounting
      return 0
    fi
    sleep 1
  done
  echo "ERROR: NICENANO not detected within 60s"
  return 1
}

wait_for_unmount() {
  for _ in $(seq 1 30); do
    [ ! -d "$MOUNT" ] && return 0
    sleep 1
  done
}

wait_for_mount "LEFT"
echo ">> Flashing left..."
cp "$LEFT_UF2" "$MOUNT/"
sync
echo ">> Left flashed. Waiting for device to reset..."
wait_for_unmount

wait_for_mount "RIGHT"
echo ">> Flashing right..."
cp "$RIGHT_UF2" "$MOUNT/"
sync
echo ">> Right flashed."

# Print memory budget summary captured from the build logs
print_budget() {
  local label="$1" log="$2"
  echo "  $label:"
  awk '/^Memory region/{flag=1; next} flag && /^[ ]*FLASH:|^[ ]*RAM:/{print "    " $0} flag && /^[ ]*IDT_LIST:/{flag=0}' "$log"
}

echo ""
echo "==============================================="
echo "  Firmware memory budget"
echo "==============================================="
print_budget "Left  (Studio + nice_view)" "$LEFT_LOG"
print_budget "Right (nice_view)         " "$RIGHT_LOG"
echo ""
echo "✅ Both halves built and flashed. They will auto-reset and re-pair over BT."
"""

[tasks.draw]
description = "Regenerate keymap SVG locally using keymap-drawer"
# -j config/eyelash_sofle.json (not -z eyelash_sofle): the CI draw workflow
# picks the layout from config/<keyboard>.json, and the two sources differ by
# 1-2px. Using -z locally made every merge produce a [Draw] commit rewriting
# 20 lines of the SVG. With -j the local render is byte-identical to CI.
run = """
uvx --from keymap-drawer==0.23.0 keymap -c keymap_drawer.config.yaml parse -z config/eyelash_sofle.keymap -o keymap-drawer/eyelash_sofle.yaml
uvx --from keymap-drawer==0.23.0 keymap -c keymap_drawer.config.yaml draw -j config/eyelash_sofle.json keymap-drawer/eyelash_sofle.yaml -o keymap-drawer/eyelash_sofle.svg
echo "SVG written to keymap-drawer/eyelash_sofle.svg"
"""

[tasks.flash-release]
description = "Download latest main firmware from GH Actions and flash BOTH halves interactively"
run = """
set -euo pipefail

REPO="rdlu/sofleii"
MOUNT="/run/media/$USER/NICENANO"
WORK=$(mktemp -d)
trap 'rm -rf "$WORK"' EXIT

echo ">> Fetching latest successful main build from GitHub Actions..."
RUN_ID=$(gh run list --repo "$REPO" --workflow "Build ZMK firmware" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
if [ -z "$RUN_ID" ]; then
  echo "ERROR: no successful main build found on $REPO"
  exit 1
fi
echo "   run $RUN_ID"

gh run download "$RUN_ID" --repo "$REPO" --dir "$WORK" >/dev/null

# Upstream ZMK workflow names artifacts inconsistently. Rename to canonical
# filenames so local and release flows use the same names everywhere.
GH_LEFT="$WORK/firmware/eyelash_sofle_studio_left.uf2"
GH_RIGHT="$WORK/firmware/nice_view-eyelash_sofle_right-zmk.uf2"
LEFT_UF2="$WORK/firmware/eyelash_sofle_left.uf2"
RIGHT_UF2="$WORK/firmware/eyelash_sofle_right.uf2"

for f in "$GH_LEFT" "$GH_RIGHT"; do
  if [ ! -f "$f" ]; then
    echo "ERROR: expected artifact missing: $f"
    exit 1
  fi
done

mv "$GH_LEFT" "$LEFT_UF2"
mv "$GH_RIGHT" "$RIGHT_UF2"

wait_for_mount() {
  local label="$1"
  echo ""
  echo "==============================================="
  echo ">> Double-tap RESET on the $label half now"
  echo "==============================================="
  for _ in $(seq 1 60); do
    if [ -d "$MOUNT" ]; then
      sleep 1  # give udisks a moment to finish mounting
      return 0
    fi
    sleep 1
  done
  echo "ERROR: NICENANO not detected within 60s"
  return 1
}

wait_for_unmount() {
  for _ in $(seq 1 30); do
    [ ! -d "$MOUNT" ] && return 0
    sleep 1
  done
}

# LEFT
wait_for_mount "LEFT"
echo ">> Flashing left..."
cp "$LEFT_UF2" "$MOUNT/"
sync
echo ">> Left flashed. Waiting for device to reset..."
wait_for_unmount

# RIGHT
wait_for_mount "RIGHT"
echo ">> Flashing right..."
cp "$RIGHT_UF2" "$MOUNT/"
sync
echo ">> Right flashed."

echo ""
echo "✅ Both halves flashed. They will auto-reset and re-pair over BT."
"""

[tasks.flash-release-reset]
description = "Download latest main firmware and flash settings_reset on whichever half is mounted"
run = """
set -euo pipefail

REPO="rdlu/sofleii"
MOUNT="/run/media/$USER/NICENANO"
WORK=$(mktemp -d)
trap 'rm -rf "$WORK"' EXIT

echo ">> Fetching latest successful main build..."
RUN_ID=$(gh run list --repo "$REPO" --workflow "Build ZMK firmware" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
gh run download "$RUN_ID" --repo "$REPO" --dir "$WORK" >/dev/null

# build.yaml gives settings_reset an explicit artifact-name, so this no longer
# depends on how the upstream workflow spells the board.
RESET_UF2="$WORK/firmware/settings_reset.uf2"
[ -f "$RESET_UF2" ] || { echo "ERROR: $RESET_UF2 missing"; exit 1; }

echo ""
echo "==============================================="
echo ">> Double-tap RESET on the half to clear now"
echo "==============================================="
for _ in $(seq 1 60); do
  [ -d "$MOUNT" ] && break
  sleep 1
done
[ -d "$MOUNT" ] || { echo "ERROR: NICENANO not detected"; exit 1; }
sleep 1

cp "$RESET_UF2" "$MOUNT/"
sync
echo "✅ settings_reset flashed. Now flash the normal firmware on top."
"""

[tasks.draw-pdf]
description = "Convert the local keymap (keymap-drawer/eyelash_sofle.yaml) to a printable A4 PDF — one page per group of layers (LAYERS_PER_PAGE, default 4)"
run = """
set -euo pipefail
YAML="keymap-drawer/eyelash_sofle.yaml"
CFG="keymap_drawer.config.yaml"
PDF="keymap-drawer/eyelash_sofle.pdf"
PER_PAGE="${LAYERS_PER_PAGE:-4}"
[ -f "$YAML" ] || { echo "ERROR: $YAML not found. Run 'mise run draw' (local) or 'mise run draw-pdf-ci' (CI version) first."; exit 1; }
command -v weasyprint >/dev/null || { echo "ERROR: weasyprint not found. Run 'mise install' to provision the pipx:weasyprint tool from .mise.toml."; exit 1; }

VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
DATE=$(date -I)  # ISO 8601 — YYYY-MM-DD
WORKDIR=$(mktemp -d)
TMP_HTML="$WORKDIR/keymap.html"
trap 'rm -rf "$WORKDIR"' EXIT

# Layer names in keymap order = the keys under `layers:` in the parsed YAML.
# (Block list items start with `- `; wrapped inline lists are 4-space indented;
# both are excluded by requiring a letter at exactly 2-space indent.)
LAYERS=$(awk '/^layers:/{f=1; next} /^combos:/{f=0} f && /^  [A-Za-z]/ {line=$0; sub(/:.*/, "", line); sub(/^  /, "", line); print line}' "$YAML")
TOTAL=$(echo "$LAYERS" | wc -l | tr -d ' ')
[ "$TOTAL" -gt 0 ] || { echo "ERROR: no layers found in $YAML"; exit 1; }
PAGES=$(( (TOTAL + PER_PAGE - 1) / PER_PAGE ))

# HTML head. Each .page fills the A4 content box (page height 29.7cm minus the
# top/bottom margins 1.6/1.7cm ≈ 26.4cm; 26.2 leaves slack) so every group of
# layers lands on its own page instead of being crammed onto one.
cat > "$TMP_HTML" <<'HTML_EOF'
<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  @page {
    size: A4;
    margin: 1.6cm 1.4cm 1.7cm 1.4cm;
    @top-center {
      content: "Eyelash Sofle — Keymap Layout · @@VERSION@@";
      font: 600 11pt sans-serif;
      padding-bottom: 6pt;
      border-bottom: 0.5pt solid #999;
      vertical-align: bottom;
    }
    @bottom-center {
      content: "Generated @@DATE@@ · github.com/rdlu/sofleii · Page " counter(page) " / " counter(pages);
      font: 9pt sans-serif;
      color: #666;
      padding-top: 6pt;
      border-top: 0.5pt solid #ccc;
      vertical-align: top;
    }
  }
  html, body { margin: 0; padding: 0; }
  .page {
    height: 26.2cm;
    display: flex;
    align-items: center;
    justify-content: center;
    page-break-after: always;
  }
  .page:last-child { page-break-after: auto; }
  .page img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style></head><body>
HTML_EOF
sed -i "s|@@VERSION@@|$VERSION|g; s|@@DATE@@|$DATE|g" "$TMP_HTML"

# Render one SVG per group of PER_PAGE layers and append a page for each.
page=0
start=1
while [ "$start" -le "$TOTAL" ]; do
  page=$((page + 1))
  end=$((start + PER_PAGE - 1))
  NAMES=$(echo "$LAYERS" | sed -n "${start},${end}p")
  SVG_OUT="$WORKDIR/page${page}.svg"
  OLDIFS=$IFS
  IFS='
'
  set -- $NAMES
  IFS=$OLDIFS
  echo ">> Page $page: $*"
  uvx --from keymap-drawer==0.23.0 keymap -c "$CFG" draw -j config/eyelash_sofle.json "$YAML" -s "$@" -o "$SVG_OUT"
  SVG_ABS=$(realpath "$SVG_OUT")
  cat >> "$TMP_HTML" <<EOF
<div class="page"><img src="file://$SVG_ABS" alt="Eyelash Sofle keymap page $page"></div>
EOF
  start=$((end + 1))
done

echo '</body></html>' >> "$TMP_HTML"
weasyprint "$TMP_HTML" "$PDF"
echo "PDF written to $PDF ($PAGES page(s), $TOTAL layers, $PER_PAGE per page · version $VERSION · $DATE)"
"""

[tasks.draw-pdf-fresh]
description = "Regenerate the SVG locally (mise run draw) and then build the PDF"
depends = ["draw"]
run = "mise run draw-pdf"

[tasks.draw-pdf-ci]
description = "Fetch the parsed keymap (YAML) from origin/main and build the paginated PDF (no local keymap regen)"
run = """
set -euo pipefail
command -v git >/dev/null || { echo "ERROR: git not found."; exit 1; }
echo ">> Fetching latest origin/main..."
git fetch origin main --quiet || { echo "ERROR: failed to fetch origin/main (no network or remote unreachable?)"; exit 1; }
git show origin/main:keymap-drawer/eyelash_sofle.yaml > keymap-drawer/.eyelash_sofle.ci.yaml || {
  rm -f keymap-drawer/.eyelash_sofle.ci.yaml
  echo "ERROR: keymap-drawer/eyelash_sofle.yaml not found on origin/main."
  exit 1
}
# Swap the local YAML with the origin/main version for this generation, then restore.
mv keymap-drawer/eyelash_sofle.yaml keymap-drawer/.eyelash_sofle.local.yaml.bak
mv keymap-drawer/.eyelash_sofle.ci.yaml keymap-drawer/eyelash_sofle.yaml
trap 'mv -f keymap-drawer/.eyelash_sofle.local.yaml.bak keymap-drawer/eyelash_sofle.yaml 2>/dev/null || true' EXIT
mise run draw-pdf
echo ">> PDF built from origin/main's parsed keymap (YAML)."
"""

[tasks.open-pdf]
description = "Generate the PDF from the current local SVG and open it in the default viewer"
depends = ["draw-pdf"]
run = """
set -euo pipefail
PDF="keymap-drawer/eyelash_sofle.pdf"
command -v xdg-open >/dev/null || { echo "ERROR: xdg-open not found. Install xdg-utils or open $PDF manually."; exit 1; }
[ -f "$PDF" ] || { echo "ERROR: $PDF missing — generation failed."; exit 1; }
xdg-open "$PDF"
"""

# The sofleii site (site/, https://sofleii.dlu.one/). hugo comes from pacman;
# both tasks warn when it isn't the version CI builds with, pinned in
# site/.hugo-version (inside site/, so bumping it only redeploys the docs).
[tasks.docs]
description = "Docs site dev server on http://127.0.0.1:1313/ (live reload)"
dir = "site"
run = """
want=$(cat .hugo-version)
hugo version | grep -q "v${want}-" || echo "warning: $(hugo version | cut -d' ' -f2) is not the pinned hugo v${want} (site/.hugo-version)" >&2
hugo server --bind 127.0.0.1 --port 1313
"""

[tasks.docs-build]
description = "Minified docs site build into site/public/"
dir = "site"
run = """
want=$(cat .hugo-version)
hugo version | grep -q "v${want}-" || echo "warning: $(hugo version | cut -d' ' -f2) is not the pinned hugo v${want} (site/.hugo-version)" >&2
hugo --minify --cleanDestinationDir
"""
