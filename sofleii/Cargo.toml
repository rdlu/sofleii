[package]
name = "sofleii"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Sofle Interactive Interface: CLI (and later TUI) for the Eyelash Sofle over ZMK Studio RPC"
repository = "https://github.com/rdlu/sofleii"
publish = false

[[bin]]
name = "sofleii"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No libudev: port enumeration falls back to sysfs, so the binary needs no
# libudev headers to build and no extra shared library to run.
serialport = { version = "4", default-features = false }
# BlueZ over the system D-Bus for `battery`. Pure Rust (no libdbus), and the
# blocking API on the async-io backend needs no tokio (bluer would).
# 5.13 is the newest zbus whose MSRV fits rust-version 1.85.
zbus = { version = "5.13.2", default-features = false, features = ["blocking-api", "async-io"] }

[build-dependencies]
prost-build = "0.14"

[profile.release]
# Size over peak speed: sofleii is I/O-bound (serial, D-Bus), so the extra
# speed of opt-level 3 buys nothing. Measured 2026-10-17 after zbus landed:
# 3.32 MB (strip only) -> 2.38 MB (+LTO, 1 CGU) -> 1.83 MB (opt "s")
# -> 1.57 MB (panic = "abort"; no catch_unwind anywhere).
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
