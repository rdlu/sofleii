[package]
name = "sofleii"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Sofle Interactive Interface: CLI and TUI for the Eyelash Sofle over ZMK Studio RPC"
repository = "https://github.com/rdlu/sofleii"
publish = false

[[bin]]
name = "sofleii"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# Local wall-clock time for the TUI log pane (`HH:MM:SS`): the system zone
# (TZ, /etc/localtime, /usr/share/zoneinfo), no bundled tzdb.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Core diagnostics; the CLI and the TUI each install a logger (no env_logger).
log = "0.4"
prost = "0.14"
# The TUI. Only the crossterm backend (used through ratatui::crossterm, no
# direct crossterm dependency), no extra widgets or macros.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No libudev: port enumeration falls back to sysfs, so the binary needs no
# libudev headers to build and no extra shared library to run.
serialport = { version = "4", default-features = false }
# SIGTERM/SIGHUP/SIGINT set a flag the TUI event loop checks, so the terminal
# is restored on the way out.
signal-hook = "0.4.5"
# HTTPS for `update check` (GitHub REST API): blocking, so no tokio; rustls
# with ring and the bundled webpki roots, so no OpenSSL and no system CA
# lookup. No gzip/json features (serde_json is already here). Costs about
# 1.26 MB of release binary (1.69 -> 2.95 MB, measured 2026-10-19; the
# roots are ~65 KB of that, the rest is rustls + ring).
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
# BlueZ over the system D-Bus for `battery` and the BLE transport. Pure Rust
# (no libdbus). zbus 6 has no blocking API: `bluez::call` wraps each call in
# `zbus::block_on`, on zbus's own runtime (`default-rt`, no tokio; bluer
# would need it).
zbus = { version = "6.0.0", default-features = false, features = ["default-rt"] }

[build-dependencies]
prost-build = "0.14"

[profile.release]
# Size over peak speed: sofleii is I/O-bound (serial, D-Bus), so the extra
# speed of opt-level 3 buys nothing. Measured 2026-10-17 after zbus landed:
# 3.32 MB (strip only) -> 2.38 MB (+LTO, 1 CGU) -> 1.83 MB (opt "s")
# -> 1.57 MB (panic = "abort"; no catch_unwind anywhere).
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
