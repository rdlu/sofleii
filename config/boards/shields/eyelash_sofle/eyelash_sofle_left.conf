CONFIG_ZMK_SLEEP=y

#EXT POWER
CONFIG_ZMK_EXT_POWER=y

#BLE-passkey
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

#BLE-clean
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

#usb-name
CONFIG_USB_DEVICE_MANUFACTURER="sofle"

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_POINTING=y

# enable display drivers
CONFIG_ZMK_DISPLAY=y

# === Studio + custom RPC (Central only) ===
# BLE profile status/control over Studio RPC (cormoran zmk-module-ble-management).
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# === Runtime Sensor Rotate (Encoder, Central only) ===
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# === Settings (Central only) ===
CONFIG_SETTINGS=y

# === Split (Central only) ===
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# === Peripheral battery (Central only, #45) ===
# Fetch the right half's battery level over the split link, and re-expose it
# to the host as a second Battery Service (0x180F), so hosts and sofleii can
# see both halves.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# === Device/build info over Studio RPC (Central only, #46) ===
# cormoran zmk-feature-device-info: custom subsystem `zmk__device_info` returns
# BuildInfo (zmk / zmk-config / Zephyr versions, build timestamp, board, GNU
# build-id) + hardware id and reset cause; `sofleii info` reads it.
# REQUIRE_UNLOCK defaults to y (subsystem marked "secured"). Studio locking is
# off in this build (-DCONFIG_ZMK_STUDIO_LOCKING=n: the lock state starts and
# stays UNLOCKED), so reads would pass anyway; it is set to n explicitly so
# headless reads (sofleii, the update check) keep working if locking is ever
# turned back on. Build info is read-only and not sensitive.
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC_REQUIRE_UNLOCK=n
