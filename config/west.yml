manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # The eyelash_sofle shield is vendored in-repo at config/boards/shields/
    # (the vendor module a741725193/zmk-sofle only targets ZMK v0.3 and
    # hardcodes every DYA module into its confs/overlays).
    #
    # cormoran's ZMK fork, ZMK-main line (Zephyr 4.1, HWMv2). `main+dya` =
    # `main+custom-studio-protocol` + cormoran's BLE/activity extensions — the
    # custom Studio RPC that ble-management (and the planned TUI) talks through.
    - name: zmk
      remote: cormoran
      revision: e5c9b6915b56801193e359dd9bad4a167ce0d1b8  # track: main+dya
      import: app/west.yml
    # Zephyr OVERRIDE. zmk/app/west.yml declares zephyr at the *branch*
    # `v4.1.0+zmk-fixes`, so pinning zmk alone would NOT freeze Zephyr — west
    # re-resolves that branch name on every update. A project declared in the
    # top-level manifest takes precedence over the same name in an imported one,
    # so this entry pins it. It must replicate zmk's entry verbatim (clone-depth
    # + the whole import name-blocklist); only `revision` differs. If you bump
    # zmk and its manifest changes this block, mirror the change here.
    - name: zephyr
      remote: zmkfirmware
      revision: 10ba6d0cb38bc3d258775d27982f707599320085  # track: v4.1.0+zmk-fixes
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
    # cormoran custom-RPC modules. Only the ones with a ZMK-main (v4) line are
    # kept: battery-history and settings-rpc are still v0.3-only upstream, and
    # runtime-input-processor was only pulled in by the vendor overlay (the
    # keymap uses stock zip_* processors).
    - name: zmk-module-ble-management
      remote: cormoran
      revision: 57738cc4fc6ba80e82a7ac57741a0339cb186cd4  # track: main
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: 8b1125ed676c1f5e14145d217984f33d0ebdcef4  # track: main
  self:
    path: config
