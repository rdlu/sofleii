---
# The zmk-rgb-layer module (per-layer underglow indicator) lives in-repo at
# zmk-rgb-layer/. It is a self-contained Zephyr module (zmk-rgb-layer/zephyr/
# module.yml), added to each eyelash build via -DZMK_EXTRA_MODULES — exactly as
# the local `mise run build-{left,right}` tasks do. ${GITHUB_WORKSPACE} is where
# the reusable build-user-config workflow checks out this repo; it is expanded by
# bash in the build step. We deliberately do NOT add a root zephyr/module.yml
# (which would auto-set ZMK_EXTRA_MODULES) because the local west workspace keeps
# the Zephyr RTOS at ./zephyr — a root marker would collide with it.
#
# zmk-sofleii-id (the identity record sofleii checks before flashing, #98)
# rides along the same way: ZMK_EXTRA_MODULES is a CMake list, quoted so bash
# does not split the run line at the ';'.
#
# The left half also loads config/ci-git-safe-directory.cmake: the build runs as
# root in ZMK's container on a runner-owned checkout, so git would refuse the repo
# ("dubious ownership") and zmk-feature-device-info (#46) would embed an empty
# zmk_config_version. The file marks the workspace safe for that configure run.
include:
  - board: nice_nano//zmk
    shield: eyelash_sofle_left nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/zmk-rgb-layer;${GITHUB_WORKSPACE}/zmk-sofleii-id" -DCMAKE_PROJECT_INCLUDE_BEFORE=${GITHUB_WORKSPACE}/config/ci-git-safe-directory.cmake
    artifact-name: eyelash_sofle_studio_left
  - board: nice_nano//zmk
    shield: eyelash_sofle_right nice_view
    cmake-args: -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/zmk-rgb-layer;${GITHUB_WORKSPACE}/zmk-sofleii-id"
    artifact-name: nice_view-eyelash_sofle_right-zmk
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset
